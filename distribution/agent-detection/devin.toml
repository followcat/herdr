id = "devin"
version = "2026.10.28.1"
min_engine_version = 1
updated_at = "2026-10-28T00:00:00Z"
aliases = ["devin-cli", "devin cli"]

[[rules]]
id = "workspace_trust_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = [
  "do you trust the authors of this directory?",
  "with untrusted content.",
  "yes, trust ",
]

[[rules]]
id = "permission_prompt"
state = "blocked"
priority = 290
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["approve once", "select", "confirm", "esc cancel"]

[[rules]]
id = "question_prompt_footer"
state = "blocked"
priority = 280
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["select", "confirm", "switch question", "esc cancel"]

[[rules]]
id = "running_tools_footer"
state = "working"
priority = 200
region = "bottom_non_empty_lines(20)"
visible_working = true
contains = ["running tools"]
any = [{ contains = ["esc to interrupt"] }, { contains = ["esc twice to interrupt"] }]
not = [
  { contains = ["approve once", "esc cancel"] },
]

[[rules]]
id = "thinking_footer"
state = "working"
priority = 195
region = "bottom_non_empty_lines(20)"
visible_working = true
line_regex = ['(?i)\bthinking\s*·']
any = [{ contains = ["esc to interrupt"] }, { contains = ["esc twice to interrupt"] }]
not = [
  { contains = ["approve once", "esc cancel"] },
]

[[rules]]
id = "guide_while_working"
state = "working"
priority = 190
region = "bottom_non_empty_lines(6)"
visible_working = true
contains = ["guide devin while it works"]
not = [
  { contains = ["approve once", "esc cancel"] },
]

[[rules]]
id = "queued_messages_footer"
state = "working"
priority = 185
region = "bottom_non_empty_lines(6)"
visible_working = true
line_regex = ['(?i)^\s*❭\s+Press Enter to send queued messages now\s*$']
not = [
  { contains = ["approve once", "esc cancel"] },
]

[[rules]]
id = "tool_reading_timeout"
state = "working"
priority = 180
region = "bottom_non_empty_lines(8)"
visible_working = true
contains = ["reading shell ", "timeout:"]
not = [
  { contains = ["approve once", "esc cancel"] },
]

[[rules]]
id = "welcome_prompt_footer"
state = "idle"
priority = 120
region = "bottom_non_empty_lines(8)"
visible_idle = true
contains = ["ask devin to build", "features, fix bugs", "your code"]
line_regex = ['^\s*❭ Ask Devin to build']
not = [
  { contains = ["approve once", "esc cancel"] },
  { contains = ["running tools"], any = [{ contains = ["esc to interrupt"] }, { contains = ["esc twice to interrupt"] }] },
  { line_regex = ['(?i)\bthinking\s*·'], any = [{ contains = ["esc to interrupt"] }, { contains = ["esc twice to interrupt"] }] },
  { line_regex = ['(?i)^\s*❭\s+Press Enter to send queued messages now\s*$'] },
  { contains = ["guide devin while it works"] },
]

[[rules]]
id = "live_prompt_footer"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(6)"
visible_idle = true
contains = ["context:"]
line_regex = ['^\s*❭']
not = [
  { contains = ["approve once", "esc cancel"] },
  { contains = ["running tools"], any = [{ contains = ["esc to interrupt"] }, { contains = ["esc twice to interrupt"] }] },
  { line_regex = ['(?i)\bthinking\s*·'], any = [{ contains = ["esc to interrupt"] }, { contains = ["esc twice to interrupt"] }] },
  { line_regex = ['(?i)^\s*❭\s+Press Enter to send queued messages now\s*$'] },
  { contains = ["guide devin while it works"] },
]
